# docker-compose.prod.yml — Production overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   - No source volume mount (immutable image)
#   - Replica scaling for the API
#   - nginx reverse proxy with TLS termination
#   - Resource limits enforced
#   - No development ports exposed directly

version: "3.9"

services:

  app:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: WARNING
    # Remove the dev source-code mount
    volumes:
      - chroma-data:/app/chroma_db
      - app-logs:/app/logs
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    # Do not expose port directly — nginx fronts it
    ports: []

  ollama:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fraud-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - fraud-net
    depends_on:
      - app

  prometheus:
    restart: always
    # Do not expose Prometheus publicly in production
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
