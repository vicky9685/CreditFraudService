# docker-compose.yml — Local development deployment
# Usage: docker compose up --build
#
# Services:
#   app     — CreditFraudService FastAPI server
#   ollama  — Ollama LLM server running Qwen3
#   prometheus — Metrics scraping
#   grafana — Dashboard

version: "3.9"

networks:
  fraud-net:
    driver: bridge

volumes:
  chroma-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  app-logs:

services:

  # ── Ollama LLM server (Qwen3) ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: fraud-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Pull Qwen3 model on first start
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 10 &&
       ollama pull qwen3:latest &&
       wait"

  # ── CreditFraudService API ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fraud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:latest
      CHROMA_PERSIST_DIR: /app/chroma_db
      AUDIT_LOG_FILE: /app/logs/audit.jsonl
      LOG_LEVEL: INFO
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    volumes:
      - chroma-data:/app/chroma_db
      - app-logs:/app/logs
      # Live-reload source for development
      - .:/app
    networks:
      - fraud-net
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Prometheus metrics ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fraud-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ── Grafana dashboard ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - fraud-net
    depends_on:
      - prometheus
