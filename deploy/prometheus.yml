global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fraud-api"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /api/v1/governance/metrics/prometheus
    scrape_interval: 15s

  - job_name: "ollama"
    static_configs:
      - targets: ["ollama:11434"]
    metrics_path: /metrics
    scrape_interval: 30s
